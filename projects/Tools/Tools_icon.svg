<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tools wrench icon">
	<rect width="512" height="512" rx="96" fill="#1b2a38"/>
	<defs>
		<!-- cut-outs for the wrench: open jaw on the head, hanging hole on the tail -->
		<mask id="wrench-cut">
			<rect x="-260" y="-260" width="520" height="520" fill="#fff"/>
			<rect x="118" y="-24" width="120" height="48" rx="6" fill="#000"/>
			<circle cx="-128" cy="0" r="13" fill="#000"/>
		</mask>
	</defs>
	<g transform="translate(256 256)">
		<!-- screwdriver (behind), handle bottom-right -->
		<g transform="rotate(45)">
			<rect x="-150" y="-10" width="180" height="20" rx="3" fill="#c9d3de"/>
			<path d="M-150,-10 L-178,-4 L-178,4 L-150,10 Z" fill="#c9d3de"/>
			<rect x="22" y="-18" width="26" height="36" rx="4" fill="#8a97a6"/>
			<rect x="44" y="-32" width="130" height="64" rx="28" fill="#3fb8af"/>
			<rect x="60" y="-20" width="98" height="10" rx="5" fill="#ffffff" opacity="0.3"/>
		</g>
		<!-- wrench (front), head top-right -->
		<g transform="rotate(-45)">
			<g mask="url(#wrench-cut)">
				<rect x="-160" y="-26" width="270" height="52" rx="26" fill="#f2a93b"/>
				<circle cx="128" cy="0" r="72" fill="#f2a93b"/>
				<circle cx="-128" cy="0" r="34" fill="#f2a93b"/>
			</g>
			<!-- highlight -->
			<rect x="-110" y="-16" width="190" height="9" rx="4.5" fill="#ffffff" opacity="0.3"/>
		</g>
	</g>
</svg>
