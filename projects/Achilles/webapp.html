		<meta charset="utf-8" />
		<title>Achilles</title>
		<meta name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="description" content="A browser-playable revival of the 2008 Flash brawler Achilles, powered by Ruffle." />
		<meta name="theme-color" content="#6e1f1a" />

		<!-- PWA / Add to Home Screen: launches chrome-free in standalone mode -->
		<link rel="manifest" href="manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Achilles" />
		<link rel="apple-touch-icon" href="Achilles_icon.svg" />
		<link rel="icon" href="Achilles_icon.svg" type="image/svg+xml" />

		<link rel="stylesheet" href="assets/css/effects.css" />
		<style>
			/* Standalone app shell — the game owns the whole viewport. No theme CSS
			   or scroll scripts are loaded here, which is what keeps it smooth on
			   mobile compared with the full project page. */
			html, body {
				margin: 0;
				height: 100%;
				background: #170d0a;
				overflow: hidden;
				overscroll-behavior: none;
				-webkit-tap-highlight-color: transparent;
				/* The standalone app is all game — no prose to select, so no
				   reason for iOS to ever offer the loupe or a callout here. */
				-webkit-touch-callout: none;
				-webkit-user-select: none;
				user-select: none;
			}
			#achilles-page {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			/* Rotate-to-play gate: held upright, the game is replaced outright by
			   a message asking for landscape — no forced rotation, no sideways
			   rendering, nothing running behind the message. achilles_app.js
			   toggles this class from a matchMedia("(orientation: portrait)")
			   listener, so turning the phone swaps the two live. */
			#achilles-rotate-message {
				display: none;
			}
			html.achilles-portrait #achilles-page {
				display: none;
			}
			html.achilles-portrait #achilles-rotate-message {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				padding: 24px;
				text-align: center;
				color: #ffcc33;
				font-size: 1.1rem;
				line-height: 1.5;
			}
			#achilles-stage {
				height: 100%;
				justify-content: center;
			}
			/* Fill the viewport rather than shrink-wrapping the SWF's 700:500
			   box. Ruffle letterboxes the movie inside the frame on its own, so
			   the game looks identical — but the frame now reaches the screen
			   edges, which is what lets the touch controls sit out in the black
			   bars beside the game instead of on top of it. */
			#achilles-frame {
				width: 100%;
				height: 100%;
				max-width: none;
				aspect-ratio: auto;
				border-radius: 0;
				box-shadow: none;
				background: #170d0a;
			}
		</style>
	</head>

	<body class="achilles-app">
		<!-- Google Tag Manager (noscript) -->
		<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NXVSDNVW"
		height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
		<!-- End Google Tag Manager (noscript) -->
		<div id="achilles-page">
			<div id="achilles-stage">
				<div id="achilles-frame">
					<button id="achilles-gate" aria-label="Tap to start">
						<span id="achilles-gate-label">Tap to Start</span>
					</button>
					<div id="achilles-tap-hint" aria-hidden="true">3 taps here<br />to spawn<br />the buttons</div>
					<div class="achilles-controls">
						<div class="achilles-move">
							<button class="achilles-btn-left" data-key="left" aria-label="Move left">&#9664;</button>
							<button class="achilles-btn-right" data-key="right" aria-label="Move right">&#9654;</button>
						</div>
						<div class="achilles-actions">
							<button class="achilles-btn-jump" data-key="jump" aria-label="Jump">Jump</button>
							<button class="achilles-btn-attack" data-key="attack" aria-label="Attack">Attack</button>
							<button class="achilles-btn-kick" data-key="kick" aria-label="Kick">Kick</button>
							<button class="achilles-btn-block" data-key="block" aria-label="Block">Block</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div id="achilles-rotate-message">Rotate your device to landscape to play.</div>

		<!-- game (no theme scripts: this is the lean, fast app build) -->
		<script src="assets/js/achilles_app.js"></script>
		<script>
			// Register the service worker so the app is installable and loads its
			// assets from cache (faster, and works offline once visited).
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", function () {
					navigator.serviceWorker.register("sw.js").catch(function () {});
				});
			}
		</script>
	</body>
</html>
